<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha Cargo: каргоны үнэ тооцоолуур</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#12141b; --ink:#f6f4ee; --muted:#9a9dae;
  --amber:#FDAD16; --amber-hi:#ffd36e; --slate:#3d4150;
  --edge:rgba(255,255,255,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(160deg,#12141b 0%,#1b1e29 55%,#14161e 100%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px)}
.aurora i:nth-child(1){width:55vmax;height:55vmax;right:-18vmax;top:-20vmax;background:radial-gradient(circle,rgba(253,173,22,.5),transparent 65%);animation:d1 30s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:60vmax;height:60vmax;left:-24vmax;top:14vmax;background:radial-gradient(circle,rgba(75,82,110,.85),transparent 65%);animation:d2 34s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:40vmax;height:40vmax;left:30vmax;bottom:-22vmax;background:radial-gradient(circle,rgba(253,140,22,.28),transparent 65%);animation:d1 40s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(-7vmax,6vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(9vmax,-4vmax) scale(.92)}}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.id{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:46px;width:auto;border-radius:12px;box-shadow:0 10px 26px -10px rgba(253,173,22,.7)}
h1{margin:0;font-size:clamp(20px,4.6vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tag{margin:3px 0 0;font-size:13px;color:var(--muted)}
.snd{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--amber);cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
.snd[aria-pressed="false"]{color:var(--muted)}
.snd[aria-pressed="false"] .w{display:none}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:820px){.grid{grid-template-columns:1.05fr .95fr}.span2{grid-column:1/-1}}
.glass{position:relative;padding:20px;border-radius:24px;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  border:1px solid var(--edge);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 24px 60px -24px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.18)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.07) 48%,transparent 66%);background-size:250% 100%;animation:sheen 10s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:120% 0}50%{background-position:-20% 0}}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field{width:100%;height:54px;padding:0 16px;font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:rgba(10,11,16,.5);border:1px solid var(--edge);border-radius:14px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.field::placeholder{color:rgba(154,157,174,.45);font-weight:500}
.field:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(253,173,22,.18);background:rgba(10,11,16,.7)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.rate{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.seg{display:flex;padding:4px;border-radius:14px;background:rgba(10,11,16,.5);border:1px solid var(--edge);height:54px}
.seg button{flex:1;min-width:58px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-weight:800;cursor:pointer;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--amber);color:#1c1a12;box-shadow:0 6px 18px -6px rgba(253,173,22,.8)}
.formula{margin:14px 0 0;font-size:13px;color:var(--muted)}
.formula b{color:var(--amber-hi);font-weight:700}
.stage{position:relative;height:190px;display:grid;place-items:center;perspective:700px;margin:-6px 0 4px}
.beam{position:absolute;left:8%;right:8%;top:0;height:2px;opacity:0;border-radius:2px;background:linear-gradient(90deg,transparent,var(--amber-hi),transparent);box-shadow:0 0 18px 4px rgba(253,173,22,.55)}
.cube{position:relative;transform-style:preserve-3d;width:var(--w);height:var(--h);animation:spin 14s linear infinite}
@keyframes spin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
.cube div{position:absolute;border:1.5px solid rgba(255,211,110,.8);background:linear-gradient(145deg,rgba(253,173,22,.26),rgba(255,255,255,.08));box-shadow:inset 0 0 22px rgba(253,173,22,.14)}
.f,.k{width:var(--w);height:var(--h);left:0;top:0}
.f{transform:translateZ(calc(var(--d)/2))}
.k{transform:rotateY(180deg) translateZ(calc(var(--d)/2))}
.l,.r{width:var(--d);height:var(--h);top:0;left:calc((var(--w) - var(--d))/2)}
.l{transform:rotateY(-90deg) translateZ(calc(var(--w)/2))}
.r{transform:rotateY(90deg) translateZ(calc(var(--w)/2))}
.t,.b{width:var(--w);height:var(--d);left:0;top:calc((var(--h) - var(--d))/2)}
.t{transform:rotateX(90deg) translateZ(calc(var(--h)/2))}
.b{transform:rotateX(-90deg) translateZ(calc(var(--h)/2))}
.vol{font-size:15px;color:var(--muted)}
.vol b{color:var(--ink);font-size:20px;font-weight:700}
.price{margin:6px 0 0;font-size:clamp(40px,10vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.05;
  background:linear-gradient(110deg,#ffe29a 0%,#FDAD16 45%,#ffe29a 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.price small{font-size:.5em;font-weight:700}
.price.est{animation:shim .55s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-100% 0}}
.meter{height:3px;border-radius:3px;margin-top:10px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,var(--amber),var(--amber-hi))}
.add{margin-top:16px;width:100%;height:56px;border:0;border-radius:16px;font:inherit;font-size:17px;font-weight:800;color:#1c1a12;cursor:pointer;
  background:linear-gradient(120deg,var(--amber-hi),var(--amber));box-shadow:0 14px 34px -14px rgba(253,173,22,.9);transition:transform .15s,filter .2s}
.add:hover{filter:brightness(1.07)}.add:active{transform:scale(.98)}
.add:disabled{opacity:.4;cursor:not-allowed;filter:none}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar h2{margin:0;font-size:18px;font-weight:800}
.ghost{border:1px solid var(--edge);background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:12px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}}
li .dim{font-weight:700}
li .sub{font-size:12px;color:var(--muted);margin-top:2px}
li .p{font-weight:800;color:var(--amber-hi);text-align:right}
li button{width:34px;height:34px;border-radius:10px;border:1px solid var(--edge);background:transparent;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
li button:hover{color:#ff8a8a;border-color:#ff8a8a}
.empty{color:var(--muted);font-size:14px;padding:6px 0 2px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:14px;border-top:1px solid var(--edge)}
.total b#tsum{font-size:26px;font-weight:800;color:var(--amber-hi)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
  var RATE=450000;
  var $=function(i){return document.getElementById(i)};
  var unit="cm", shown=0, raf=0, lastTick=0;
  var fmt=function(n){return Math.round(n).toLocaleString("en-US")};
  var num=function(s){var v=parseFloat(String(s).replace(/,/g,".").replace(/[^0-9.]/g,""));return isFinite(v)?v:0};
  var calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}

  var AC=null, snd=load("ac_sound")!=="0";
  function ctx(){
    if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
    if(AC.state==="suspended")AC.resume();
    return AC;
  }
  function tone(f,dur,vol,type,to,delay){
    if(!snd)return;var c=ctx();if(!c)return;
    var t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.03);
  }
  var S={
    tap:function(){tone(360,.08,.05,"sine",210)},
    tick:function(p){tone(520+620*p,.045,.022,"triangle")},
    settle:function(){tone(880,.24,.04,"sine");tone(1320,.32,.026,"sine",0,.07)}
  };
  document.addEventListener("pointerdown",function(){if(snd)ctx()},{once:true});
  document.addEventListener("keydown",function(){if(snd)ctx()},{once:true});
  $("snd").onclick=function(){snd=!snd;save("ac_sound",snd?"1":"0");this.setAttribute("aria-pressed",snd);if(snd)S.tap()};

  $("ratebox").textContent=fmt(RATE)+"₮";$("fr").textContent=fmt(RATE)+"₮";
  function setUnit(u){unit=u;$("u-cm").setAttribute("aria-pressed",u==="cm");$("u-m").setAttribute("aria-pressed",u==="m");S.tap();calc()}
  function vol(){
    var L=num($("L").value),W=num($("W").value),H=num($("H").value),q=Math.max(1,Math.floor(num($("Q").value))||1);
    var f=unit==="cm"?0.01:1;
    return {L:L,W:W,H:H,q:q,one:L*W*H*f*f*f};
  }
  function estimate(to){
    cancelAnimationFrame(raf);
    var from=shown,box=$("pbox");
    if(Math.round(from)===Math.round(to)){shown=to;$("price").textContent=fmt(to);box.classList.remove("est");return}
    if(calm){shown=to;$("price").textContent=fmt(to);return}
    var D=560,t0=performance.now();
    box.classList.add("est");
    $("beam").animate([{top:"6%",opacity:0},{opacity:1,offset:.15},{opacity:1,offset:.85},{top:"94%",opacity:0}],{duration:D,easing:"ease-in-out"});
    $("meter").animate([{transform:"scaleX(0)",opacity:1},{transform:"scaleX(1)",opacity:1,offset:.85},{transform:"scaleX(1)",opacity:0}],{duration:D+160,easing:"cubic-bezier(.3,.7,.2,1)"});
    (function step(t){
      var p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);
      shown=from+(to-from)*e;$("price").textContent=fmt(shown);
      if(t-lastTick>62&&p<1){lastTick=t;S.tick(p)}
      if(p<1){raf=requestAnimationFrame(step)}
      else{box.classList.remove("est");if(to>0)S.settle()}
    })(t0);
  }
  function calc(){
    var v=vol(),m3=v.one*v.q,price=m3*RATE;
    $("vol").textContent=m3?m3.toFixed(4).replace(/0+$/,"").replace(/\.$/,""):"0";
    estimate(price);
    var mx=Math.max(v.L,v.W,v.H),k=mx>0?130/mx:0,c=function(x){return x>0?Math.max(14,x*k):40};
    var s=$("cube").style;s.setProperty("--w",c(v.W)+"px");s.setProperty("--h",c(v.H)+"px");s.setProperty("--d",c(v.L)+"px");
  }
  ["L","W","H","Q"].forEach(function(id,i,a){
    $(id).addEventListener("input",calc);
    $(id).addEventListener("focus",function(){S.tap()});
    $(id).addEventListener("keydown",function(e){
      if(e.key!=="Enter")return;e.preventDefault();
      if(id==="Q"){this.blur()}else{$(a[i+1]).focus();$(a[i+1]).select()}
    });
  });
  $("u-cm").onclick=function(){setUnit("cm")};
  $("u-m").onclick=function(){setUnit("m")};
  $("reset").onclick=function(){S.tap();["L","W","H"].forEach(function(i){$(i).value=""});$("Q").value="1";calc();$("L").focus()};
  calc();
})();
</script>
</body>
</html>
